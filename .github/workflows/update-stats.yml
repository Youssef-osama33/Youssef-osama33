name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats images
        env:
          ACCESS_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          COUNT_STATS_FROM_FORKS: ${{ secrets.COUNT_STATS_FROM_FORKS }}
        run: |
          generator_dir="$RUNNER_TEMP/github-stats-transparent"
          git clone https://github.com/rahul-jha98/github-stats-transparent.git "$generator_dir"
          git -C "$generator_dir" checkout 3aac0c44907ce16d3dcaedf04795e470645eabaa
          python -m pip install --upgrade pip
          python -m pip install -r "$generator_dir/requirements.txt"
          (
            cd "$generator_dir"
            python generate_images.py
          )
          mkdir -p github-stats
          cp "$generator_dir/generated/"*.svg github-stats/

      - name: Commit Changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'github-stats/'
          message: 'update stats'
